[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-resume-skill-gap-analyzer"
version = "1.0.0"
description = "Production-grade NLP platform for automated resume screening and skill gap analysis using Sentence-BERT and domain taxonomies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vivek" }
]
keywords = [
    "nlp",
    "sentence-transformers",
    "resume-analyzer",
    "skill-gap-analysis",
    "ats",
    "streamlit",
    "pytorch",
    "bert",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.30.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "numpy>=1.24.0",
    "transformers>=4.35.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["resume_analyzer/tests"]
pythonpath = ["resume_analyzer"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
